name: Check source health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source-repo/**'
      - '.github/workflows/source-health.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-source-repo.mjs
      - run: node scripts/check-source-repo.mjs
      - name: Publish status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-repo/*/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update source health"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source-repo
      - id: deployment
        uses: actions/deploy-pages@v4
